services:
  postgres:
    image: postgres:17-alpine
    container_name: nau-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nau-db
      POSTGRES_USER: nau
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nau}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nau -d nau-db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
