<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
</head>
<body>
<h1>Регистрация</h1>
<div th:if="${message}" th:text="${message}" role="alert"></div>
<form th:action="@{/registration}" method="post">
    <div><label>Логин: <input type="text" name="login" maxlength="50" autocomplete="username" required></label></div>
    <div><label>Имя: <input type="text" name="firstName" maxlength="100" autocomplete="given-name" required></label></div>
    <div><label>Фамилия: <input type="text" name="lastName" maxlength="100" autocomplete="family-name" required></label></div>
    <div><label>Пароль: <input type="password" name="password" maxlength="72" autocomplete="new-password" required></label></div>
    <div><input type="submit" value="Зарегистрироваться"></div>
</form>
<p><a th:href="@{/login}">Войти</a></p>
</body>
</html>
