<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список проектов</title>
    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 1120px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 { margin: 0 0 12px; }
        .project-count { margin-bottom: 24px; color: #4b5563; }
        .table-wrapper { overflow-x: auto; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; vertical-align: top; }
        th { background: #e9eef5; }
        tbody tr + tr { border-top: 1px solid #e5e7eb; }
        tbody tr:nth-child(even) { background: #fafbfc; }
        .project-name { min-width: 160px; overflow-wrap: anywhere; }
        .project-description { min-width: 180px; max-width: 400px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .project-status, time { white-space: nowrap; }
        .empty { padding: 32px; text-align: center; color: #4b5563; }
    </style>
</head>
<body>
<main>
    <h1>Проекты</h1>
    <p class="project-count" th:text="|Всего проектов: ${#lists.size(projects)}|">Всего проектов: 0</p>
    <div class="table-wrapper">
        <table aria-label="Список проектов">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Название</th>
                <th scope="col">Описание</th>
                <th scope="col">Статус</th>
                <th scope="col">Создан (UTC)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="project : ${projects}">
                <td th:text="${project.id}">1</td>
                <td class="project-name" th:text="${project.name}">Название проекта</td>
                <td class="project-description" th:text="${project.description ?: 'Не указано'}">Не указано</td>
                <td class="project-status" th:switch="${project.status.name()}">
                    <span th:case="'NEW'">Новый</span>
                    <span th:case="'IN_PROGRESS'">В работе</span>
                    <span th:case="'COMPLETED'">Завершён</span>
                    <span th:case="'CANCELLED'">Отменён</span>
                    <span th:case="*" th:text="${project.status}"></span>
                </td>
                <td>
                    <time th:datetime="${project.createdAt}"
                          th:text="${#temporals.format(project.createdAt, 'dd.MM.yyyy HH:mm', 'UTC')}">01.01.2026 00:00</time>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(projects)}">
                <td class="empty" colspan="5">Проекты пока не добавлены.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
