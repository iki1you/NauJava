<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отчёт о работе приложения</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
<h1>Отчёт о работе приложения</h1>
<p>Зарегистрировано пользователей: <strong th:text="${snapshot.usersCount}">0</strong></p>

<h2>Проекты</h2>
<table>
    <thead>
    <tr><th>ID</th><th>Название</th><th>Описание</th><th>Статус</th></tr>
    </thead>
    <tbody>
    <tr th:each="project : ${snapshot.projects}">
        <td th:text="${project.id}">1</td>
        <td th:text="${project.name}">Название проекта</td>
        <td th:text="${project.description}">Описание</td>
        <td th:text="${project.status}">NEW</td>
    </tr>
    <tr th:if="${#lists.isEmpty(snapshot.projects)}">
        <td colspan="4">Проекты отсутствуют.</td>
    </tr>
    </tbody>
</table>

<h2>Время выполнения</h2>
<table>
    <thead>
    <tr><th>Операция</th><th>Время, мс</th></tr>
    </thead>
    <tbody>
    <tr>
        <td>Подсчёт пользователей</td>
        <td th:text="${snapshot.usersCountTimeMs}">0</td>
    </tr>
    <tr>
        <td>Получение списка проектов</td>
        <td th:text="${snapshot.projectsFetchTimeMs}">0</td>
    </tr>
    <tr>
        <td>Общее время формирования</td>
        <td th:text="${snapshot.totalTimeMs}">0</td>
    </tr>
    </tbody>
</table>
</body>
</html>
