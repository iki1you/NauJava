<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
</head>
<body>
<h1>Вход в систему</h1>
<p th:if="${param.error}" role="alert">Неверный логин или пароль.</p>
<p th:if="${param.logout}">Вы вышли из системы.</p>
<form th:action="@{/login}" method="post">
    <div><label>Логин: <input type="text" name="username" autocomplete="username" required></label></div>
    <div><label>Пароль: <input type="password" name="password" autocomplete="current-password" required></label></div>
    <div><input type="submit" value="Войти"></div>
</form>
<p><a th:href="@{/registration}">Зарегистрироваться</a></p>
</body>
</html>
